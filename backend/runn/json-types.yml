desc: Real HTTP rejects JSON coercion and preserves persisted customer values
concurrency: debt-api-acceptance
labels:
- api
- schema
- regression
runners:
  api:
    endpoint: ${RUNN_BASE_URL:-http://127.0.0.1:8080}
    openapi3: ../../contracts/openapi.yaml
    useCookie: true
  invalid:
    endpoint: ${RUNN_BASE_URL:-http://127.0.0.1:8080}
    openapi3: ../../contracts/openapi.yaml
    useCookie: true
    skipValidateRequest: true
vars:
  invalidCreate:
  - code: 42
    name: Numeric code rejected
  - code: false
    name: Boolean code rejected
  - code: invalid-number-name
    name: 42
  - code: invalid-float-name
    name: 0.5
  invalidVersion:
  - 0.5
  - '0'
  - '2'
  - true
  password: ${LOCAL_SEED_PASSWORD}
secrets:
- vars.password
- token
- cookie
- accountAnonymousToken
- accountAnonymousCookie
- accountCookie
steps:
  unique:
    bind:
      customerCode: '''T-'' + faker.UUID()'
  accountCsrf:
    api:
      /api/csrf:
        get:
          useCookie: false
          body: null
    bind:
      accountAnonymousToken: current.res.body.csrfToken
      accountAnonymousCookie: current.res.cookies.JSESSIONID.Value
    test: current.res.status == 200 && len(accountAnonymousToken) > 0
  accountLogin:
    api:
      /api/auth/login:
        post:
          headers:
            X-CSRF-TOKEN: '{{ accountAnonymousToken }}'
          body:
            application/json:
              email: alpha-admin@example.test
              password: '{{ vars.password }}'
    bind:
      accountCookie: current.res.cookies.JSESSIONID.Value
    test: current.res.status == 204 && len(accountCookie) > 0 && accountCookie != accountAnonymousCookie
  session:
    api:
      /api/session:
        get:
          body: null
    bind:
      token: current.res.body.csrfToken
    test: current.res.status == 200 && len(token) > 0
  before:
    api:
      /api/customers:
        get:
          body: null
    bind:
      countBefore: len(current.res.body)
    test: current.res.status == 200
  invalidCreate:
    loop: 4
    invalid:
      /api/customers:
        post:
          headers:
            X-CSRF-TOKEN: '{{ token }}'
          body:
            application/json: '{{ vars.invalidCreate[i] }}'
    test: current.res.status == 400 && current.res.body.code == 'INVALID_REQUEST'
  noCoercedCustomers:
    api:
      /api/customers:
        get:
          body: null
    test: current.res.status == 200 && len(current.res.body) == countBefore
  create:
    api:
      /api/customers:
        post:
          headers:
            X-CSRF-TOKEN: '{{ token }}'
          body:
            application/json:
              code: '{{ customerCode }}'
              name: Before rejected updates
    bind:
      customerId: current.res.body.id
    test: current.res.status == 201 && current.res.body.version == 0
  invalidVersions:
    loop: 4
    invalid:
      /api/customers/{{ customerId }}:
        put:
          headers:
            X-CSRF-TOKEN: '{{ token }}'
          body:
            application/json:
              code: '{{ customerCode }}'
              name: Must not persist
              version: '{{ vars.invalidVersion[i] }}'
    test: current.res.status == 400 && current.res.body.code == 'INVALID_REQUEST'
  invalidUuid:
    invalid:
      /api/customers/not-a-uuid:
        put:
          headers:
            X-CSRF-TOKEN: '{{ token }}'
          body:
            application/json:
              code: '{{ customerCode }}'
              name: Invalid path rejected
              version: 0
    test: current.res.status == 400 && current.res.body.code == 'INVALID_REQUEST'
  unchanged:
    api:
      /api/customers:
        get:
          body: null
    test: 'current.res.status == 200 && len(current.res.body) == countBefore + 1

      && len(filter(current.res.body, {#.id == customerId && #.name == ''Before rejected updates'' && #.version
      == 0})) == 1

      '
  logout:
    api:
      /api/logout:
        post:
          headers:
            X-CSRF-TOKEN: '{{ token }}'
          body:
            application/json: {}
    test: current.res.status == 204
