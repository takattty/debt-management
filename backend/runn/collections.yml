desc: Collection candidates use explicit business dates and retain tenant-scoped history
concurrency: debt-api-acceptance
labels: [api, collections, security]
runners:
  api:
    endpoint: ${RUNN_BASE_URL:-http://127.0.0.1:8080}
    openapi3: ../../contracts/openapi.yaml
    useCookie: true
  invalid:
    endpoint: ${RUNN_BASE_URL:-http://127.0.0.1:8080}
    openapi3: ../../contracts/openapi.yaml
    skipValidateRequest: true
vars:
  password: ${LOCAL_SEED_PASSWORD}
  fixture: json://../../work/runn-collection-metadata.json
secrets: [vars.password, anonymousToken, anonymousCookie, cookie, token]
steps:
  unauthenticated:
    invalid:
      /api/collections?asOf=2026-12-01:
        get: {body: null}
    test: current.res.status == 401
  csrf:
    api:
      /api/csrf:
        get:
          useCookie: false
          body: null
    bind:
      anonymousToken: current.res.body.csrfToken
      anonymousCookie: current.res.cookies.JSESSIONID.Value
    test: current.res.status == 200
  login:
    api:
      /api/auth/login:
        post:
          headers: {Cookie: 'JSESSIONID={{ anonymousCookie }}', X-CSRF-TOKEN: '{{ anonymousToken }}'}
          body:
            application/json: {email: alpha-accountant@example.test, password: '{{ vars.password }}'}
    bind: {cookie: current.res.cookies.JSESSIONID.Value}
    test: current.res.status == 204
  session:
    api:
      /api/session:
        get: {body: null}
    bind: {token: current.res.body.csrfToken}
    test: current.res.status == 200
  customer:
    api:
      /api/customers:
        post:
          headers: {X-CSRF-TOKEN: '{{ token }}'}
          body:
            application/json: {code: '{{ vars.fixture.customerCode }}', name: 架空の督促確認先}
    bind: {customerId: current.res.body.id}
    test: current.res.status == 201
  preview:
    api:
      /api/imports/invoices/preview:
        post:
          headers: {X-CSRF-TOKEN: '{{ token }}'}
          body:
            multipart/form-data: {file: ../../work/runn-collection.csv}
    bind: {batch: current.res.body.id}
    test: current.res.status == 201 && current.res.body.status == 'PREVIEW_VALID'
  confirm:
    api:
      /api/imports/{{ batch }}/confirm:
        post:
          headers: {X-CSRF-TOKEN: '{{ token }}'}
          body:
            application/json: {version: 0}
    test: current.res.status == 200 && current.res.body.confirmedCount == 2
  invoice:
    api:
      /api/receivables?customerId={{ customerId }}&limit=1:
        get: {body: null}
    bind:
      invoiceId: current.res.body.items[0].id
      amount: current.res.body.items[0].amount
      invoiceNumber: current.res.body.items[0].invoiceNumber
    test: current.res.status == 200 && current.res.body.items[0].customerCode == vars.fixture.customerCode
  dueDay:
    api:
      /api/collections/{{ invoiceId }}?asOf=2026-11-30:
        get: {body: null}
    test: current.res.status == 200 && !current.res.body.eligible && current.res.body.daysOverdue == 0 && current.res.body.outstandingAmount == amount
  nextDay:
    api:
      /api/collections/{{ invoiceId }}?asOf=2026-12-01:
        get: {body: null}
    test: current.res.status == 200 && current.res.body.eligible && current.res.body.daysOverdue == 1 && current.res.body.outstandingAmount == amount && !current.res.body.held && current.res.body.version == 0
  startSearch:
    bind: {pageSuffix: '""'}
  candidates:
    loop:
      count: 10000
      interval: 0
      until: 'current.res.status == 200 && (len(candidateMatches) == 1 || current.res.body.nextCursor == null)'
    api:
      /api/collections?asOf=2026-12-01&view=ACTIONABLE&limit=100{{ pageSuffix }}:
        get: {body: null}
    bind:
      candidateMatches: 'filter(current.res.body.items, {#.invoiceId == invoiceId})'
      pageSuffix: 'current.res.body.nextCursor == null ? "" : "&cursor=" + current.res.body.nextCursor'
  ownCandidate:
    test: len(candidateMatches) == 1 && candidateMatches[0].customerId == customerId && candidateMatches[0].outstandingAmount == amount && candidateMatches[0].daysOverdue == 1 && !candidateMatches[0].held
  history:
    api:
      /api/collections/{{ invoiceId }}/history:
        get: {body: null}
    test: current.res.status == 200 && len(current.res.body.items) == 0 && current.res.body.nextCursor == null
  recordNote:
    api:
      /api/collections/{{ invoiceId }}/actions:
        post:
          headers: {X-CSRF-TOKEN: '{{ token }}'}
          body:
            application/json: {version: 0, note: 請求書再送の依頼, nextActionDate: '2026-12-05'}
    test: current.res.status == 200 && current.res.body.version == 1 && current.res.body.nextActionDate == '2026-12-05' && current.res.body.event.actorLabel == 'alpha-accountant@example.test'
  missingPlannedDate:
    invalid:
      /api/collections/{{ invoiceId }}/actions:
        post:
          headers: {Cookie: 'JSESSIONID={{ cookie }}', X-CSRF-TOKEN: '{{ token }}'}
          body:
            application/json: {version: 1, note: 予定日は明示が必要}
    test: current.res.status == 400
  planUnchanged:
    api:
      /api/collections/{{ invoiceId }}?asOf=2026-12-01:
        get: {body: null}
    test: current.res.status == 200 && current.res.body.version == 1 && current.res.body.nextActionDate == '2026-12-05' && current.res.body.latestNote == '請求書再送の依頼'
  missingHoldReason:
    invalid:
      /api/collections/{{ invoiceId }}/hold:
        post:
          headers: {Cookie: 'JSESSIONID={{ cookie }}', X-CSRF-TOKEN: '{{ token }}'}
          body:
            application/json: {version: 1}
    test: current.res.status == 400
  hold:
    api:
      /api/collections/{{ invoiceId }}/hold:
        post:
          headers: {X-CSRF-TOKEN: '{{ token }}'}
          body:
            application/json: {version: 1, reason: 入金確認待ち}
    test: current.res.status == 200 && current.res.body.version == 2 && current.res.body.held && current.res.body.holdReason == '入金確認待ち' && current.res.body.nextActionDate == '2026-12-05'
  heldSearch:
    bind: {heldPageSuffix: '""'}
  heldCandidates:
    loop:
      count: 10000
      interval: 0
      until: 'current.res.status == 200 && (len(heldMatches) == 1 || current.res.body.nextCursor == null)'
    api:
      /api/collections?asOf=2026-12-01&view=HELD&limit=100{{ heldPageSuffix }}:
        get: {body: null}
    bind:
      heldMatches: 'filter(current.res.body.items, {#.invoiceId == invoiceId})'
      heldPageSuffix: 'current.res.body.nextCursor == null ? "" : "&cursor=" + current.res.body.nextCursor'
  ownHeldCandidate:
    test: len(heldMatches) == 1 && heldMatches[0].held && heldMatches[0].holdReason == '入金確認待ち' && heldMatches[0].outstandingAmount == amount
  draft:
    api:
      /api/collections/{{ invoiceId }}/draft?asOf=2026-12-01:
        get: {body: null}
    test: current.res.status == 200 && current.res.body.held && current.res.body.holdReason == '入金確認待ち' && current.res.body.outstandingAmount == amount && current.res.body.body contains invoiceNumber && current.res.body.body contains '架空の督促確認先' && current.res.body.body contains '2026-11-30'
  release:
    api:
      /api/collections/{{ invoiceId }}/release:
        post:
          headers: {X-CSRF-TOKEN: '{{ token }}'}
          body:
            application/json: {version: 2, reason: 入金状況の確認完了}
    test: current.res.status == 200 && current.res.body.version == 3 && !current.res.body.held && current.res.body.nextActionDate == '2026-12-05'
  explicitlyClearPlan:
    api:
      /api/collections/{{ invoiceId }}/actions:
        post:
          headers: {X-CSRF-TOKEN: '{{ token }}'}
          body:
            application/json: {version: 3, note: 担当交代後の対応完了メモ, nextActionDate: null}
    test: current.res.status == 200 && current.res.body.version == 4 && current.res.body.nextActionDate == null
  sharedHistory:
    api:
      /api/collections/{{ invoiceId }}/history?limit=4:
        get: {body: null}
    test: current.res.status == 200 && len(current.res.body.items) == 4 && current.res.body.items[0].kind == 'NOTE' && current.res.body.items[1].kind == 'HOLD' && current.res.body.items[2].kind == 'RELEASE' && current.res.body.items[3].nextActionDate == null && current.res.body.items[3].actorUserId == current.res.body.items[0].actorUserId
  staleHold:
    api:
      /api/collections/{{ invoiceId }}/hold:
        post:
          headers: {X-CSRF-TOKEN: '{{ token }}'}
          body:
            application/json: {version: 1, reason: 古い画面から保留}
    test: current.res.status == 409 && current.res.body.code == 'VERSION_CONFLICT'
  missingCsrf:
    invalid:
      /api/collections/{{ invoiceId }}/actions:
        post:
          headers: {Cookie: 'JSESSIONID={{ cookie }}'}
          body:
            application/json: {version: 4, note: CSRF拒否, nextActionDate: null}
    test: current.res.status == 403 && current.res.body.code == 'CSRF_INVALID'
  missingDate:
    invalid:
      /api/collections:
        get:
          headers: {Cookie: 'JSESSIONID={{ cookie }}'}
          body: null
    test: current.res.status == 400 && current.res.body.code == 'INVALID_REQUEST'
  timestampDate:
    invalid:
      /api/collections?asOf=2026-12-01T00:00:00:
        get:
          headers: {Cookie: 'JSESSIONID={{ cookie }}'}
          body: null
    test: current.res.status == 400
  cancelInvoice:
    api:
      /api/invoices/{{ invoiceId }}/cancel:
        post:
          headers: {X-CSRF-TOKEN: '{{ token }}'}
          body:
            application/json: {version: 0, reason: 架空請求の取消確認}
    test: current.res.status == 200 && current.res.body.status == 'CANCELLED' && current.res.body.outstandingAmount == 0
  cancelledCollection:
    api:
      /api/collections/{{ invoiceId }}?asOf=2026-12-01:
        get: {body: null}
    test: current.res.status == 200 && current.res.body.invoiceStatus == 'CANCELLED' && !current.res.body.eligible && current.res.body.amount == amount && current.res.body.outstandingAmount == 0
  closedNote:
    api:
      /api/collections/{{ invoiceId }}/actions:
        post:
          headers: {X-CSRF-TOKEN: '{{ token }}'}
          body:
            application/json: {version: 4, note: 取消後の確認メモ, nextActionDate: null}
    test: current.res.status == 200 && current.res.body.version == 5 && current.res.body.event.note == '取消後の確認メモ'
  closedDraft:
    api:
      /api/collections/{{ invoiceId }}/draft?asOf=2026-12-01:
        get: {body: null}
    test: current.res.status == 409 && current.res.body.code == 'COLLECTION_NOT_ELIGIBLE'
  closedHistory:
    api:
      /api/collections/{{ invoiceId }}/history?limit=5:
        get: {body: null}
    test: current.res.status == 200 && len(current.res.body.items) == 5 && current.res.body.items[0].note == '請求書再送の依頼' && current.res.body.items[4].note == '取消後の確認メモ'
