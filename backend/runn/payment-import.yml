desc: Payment CSV preview, corrections and tenant isolation over real HTTP
concurrency: debt-api-acceptance
labels: [api, importing, payments, security]
runners:
  api:
    endpoint: ${RUNN_BASE_URL:-http://127.0.0.1:8080}
    openapi3: ../../contracts/openapi.yaml
    useCookie: true
  beta:
    endpoint: ${RUNN_BASE_URL:-http://127.0.0.1:8080}
    openapi3: ../../contracts/openapi.yaml
    useCookie: true
  invalid:
    endpoint: ${RUNN_BASE_URL:-http://127.0.0.1:8080}
    openapi3: ../../contracts/openapi.yaml
    skipValidateRequest: true
vars:
  password: ${LOCAL_SEED_PASSWORD}
secrets: [vars.password, anonymousToken, anonymousCookie, cookie, token, betaToken, betaAnonymousCookie, betaCookie]
steps:
  unauthenticatedTemplate:
    invalid:
      /api/imports/payments/template:
        get:
          body: null
    test: current.res.status == 401
  csrf:
    api:
      /api/csrf:
        get:
          body: null
    bind:
      anonymousToken: current.res.body.csrfToken
      anonymousCookie: current.res.cookies.JSESSIONID.Value
    test: current.res.status == 200
  login:
    api:
      /api/auth/login:
        post:
          headers:
            Cookie: JSESSIONID={{ anonymousCookie }}
            X-CSRF-TOKEN: '{{ anonymousToken }}'
          body:
            application/json:
              email: alpha-accountant@example.test
              password: '{{ vars.password }}'
    bind:
      cookie: current.res.cookies.JSESSIONID.Value
    test: current.res.status == 204
  session:
    api:
      /api/session:
        get:
          body: null
    bind:
      token: current.res.body.csrfToken
    test: current.res.status == 200
  template:
    api:
      /api/imports/payments/template:
        get: {body: null}
    test: current.res.status == 200 && current.res.rawBody == '\uFEFFtransaction_id,transfer_date,payer_name,amount\r\n'
  missingCsrf:
    invalid:
      /api/imports/payments/preview:
        post:
          headers: {Cookie: 'JSESSIONID={{ cookie }}'}
          body:
            multipart/form-data: {file: ../../work/runn-payment-valid.csv}
    test: current.res.status == 403 && current.res.body.code == 'CSRF_INVALID'
  invalidPreview:
    api:
      /api/imports/payments/preview:
        post:
          headers: {X-CSRF-TOKEN: '{{ token }}'}
          body:
            multipart/form-data: {file: ../../work/runn-payment-invalid.csv}
    bind: {bad: current.res.body.id}
    test: current.res.status == 201 && current.res.body.kind == 'PAYMENT' && current.res.body.status == 'PREVIEW_INVALID' && current.res.body.confirmedCount == 0
  errors:
    api:
      /api/imports/{{ bad }}/errors:
        get: {body: null}
    test: current.res.status == 200 && len(current.res.body.items) == 2 && current.res.body.items[0].rowNumber == 3 && current.res.body.items[0].field == 'transfer_date' && current.res.body.items[1].field == 'amount' && current.res.body.items[1].inputValue == '0' && current.res.body.items[1].correction != ''
  download:
    api:
      /api/imports/{{ bad }}/errors.csv:
        get: {body: null}
    test: current.res.status == 200 && current.res.rawBody contains '"3","amount","0"'
  repair:
    api:
      /api/imports/payments/preview:
        post:
          headers: {X-CSRF-TOKEN: '{{ token }}'}
          body:
            multipart/form-data: {file: ../../work/runn-payment-valid.csv}
    bind: {good: current.res.body.id}
    test: current.res.status == 201 && current.res.body.status == 'PREVIEW_VALID' && current.res.body.rowCount == 2 && current.res.body.confirmedCount == 0
  rows:
    api:
      /api/imports/{{ good }}/payment-rows?limit=1:
        get: {body: null}
    test: current.res.status == 200 && len(current.res.body.items) == 1 && current.res.body.nextCursor == 1 && current.res.body.items[0].valid && current.res.body.items[0].amount == '100000' && current.res.body.items[0].payerName == '架空入金A' && current.res.body.items[0].transferDate == '0001-01-01'
  next:
    api:
      /api/imports/{{ good }}/payment-rows?cursor=1&limit=1:
        get: {body: null}
    test: current.res.status == 200 && current.res.body.nextCursor == 0 && current.res.body.items[0].amount == '200000' && current.res.body.items[0].transferDate == '9999-12-31'
  unsupportedRows:
    api:
      /api/imports/{{ good }}/rows:
        get: {body: null}
    test: current.res.status == 409 && current.res.body.code == 'IMPORT_KIND_UNSUPPORTED'
  confirm:
    api:
      /api/imports/{{ good }}/confirm:
        post:
          headers: {X-CSRF-TOKEN: '{{ token }}'}
          body:
            application/json: {version: 0}
    test: current.res.status == 200 && current.res.body.status == 'CONFIRMED' && current.res.body.confirmedCount == 2
  resend:
    api:
      /api/imports/{{ good }}/confirm:
        post:
          headers: {X-CSRF-TOKEN: '{{ token }}'}
          body:
            application/json: {version: 0}
    test: current.res.status == 200 && compare(current.res.body, steps.confirm.res.body)
  firstPaymentSearch:
    bind:
      firstPageSuffix: '""'
  payments:
    loop:
      count: 10000
      interval: 0
      until: 'current.res.status == 200 && (len(firstMatches) == 1 || current.res.body.nextCursor == null)'
    api:
      /api/payments?dateFrom=0001-01-01&dateTo=0001-01-01&limit=1{{ firstPageSuffix }}:
        get: {body: null}
    bind:
      firstMatches: 'filter(current.res.body.items, {#.sourceBatchId == good && #.transactionId == steps.rows.res.body.items[0].transactionId})'
      firstPageSuffix: 'current.res.body.nextCursor == null ? "" : "&cursor=" + current.res.body.nextCursor'
  ownFirstPayment:
    bind:
      firstId: firstMatches[0].id
    test: len(firstMatches) == 1 && firstMatches[0].amount == 100000 && firstMatches[0].unallocatedAmount == 100000 && firstMatches[0].createdByUserId != null && firstMatches[0].payerName == '架空入金A' && firstMatches[0].transferDate == '0001-01-01' && firstMatches[0].sourceBatchId == good
  nextPaymentSearch:
    bind:
      nextPageSuffix: '""'
  nextPayment:
    loop:
      count: 10000
      interval: 0
      until: 'current.res.status == 200 && (len(nextMatches) == 1 || current.res.body.nextCursor == null)'
    api:
      /api/payments?dateFrom=9999-12-31&dateTo=9999-12-31&limit=1{{ nextPageSuffix }}:
        get: {body: null}
    bind:
      nextMatches: 'filter(current.res.body.items, {#.sourceBatchId == good && #.transactionId == steps.next.res.body.items[0].transactionId})'
      nextPageSuffix: 'current.res.body.nextCursor == null ? "" : "&cursor=" + current.res.body.nextCursor'
  ownNextPayment:
    test: len(nextMatches) == 1 && nextMatches[0].id != firstId && nextMatches[0].amount == 200000 && nextMatches[0].unallocatedAmount == 200000 && nextMatches[0].createdByUserId != null && nextMatches[0].payerName == '架空入金B' && nextMatches[0].transferDate == '9999-12-31' && nextMatches[0].sourceBatchId == good
  invalidConfirm:
    api:
      /api/imports/{{ bad }}/confirm:
        post:
          headers: {X-CSRF-TOKEN: '{{ token }}'}
          body:
            application/json: {version: 0}
    test: current.res.status == 409 && current.res.body.code == 'IMPORT_INVALID'
  originalErrors:
    api:
      /api/imports/{{ bad }}:
        get: {body: null}
    test: current.res.status == 200 && current.res.body.errorCount == 2 && current.res.body.confirmedCount == 0
  betaCsrf:
    beta:
      /api/csrf:
        get:
          useCookie: false
          body: null
    bind:
      betaToken: current.res.body.csrfToken
      betaAnonymousCookie: current.res.cookies.JSESSIONID.Value
    test: current.res.status == 200
  betaLogin:
    beta:
      /api/auth/login:
        post:
          useCookie: false
          headers:
            X-CSRF-TOKEN: '{{ betaToken }}'
            Cookie: JSESSIONID={{ betaAnonymousCookie }}
          body:
            application/json:
              email: beta-admin@example.test
              password: '{{ vars.password }}'
    bind:
      betaCookie: current.res.cookies.JSESSIONID.Value
    test: current.res.status == 204
  betaSession:
    beta:
      /api/session:
        get:
          useCookie: false
          headers:
            Cookie: JSESSIONID={{ betaCookie }}
          body: null
    bind:
      betaToken: current.res.body.csrfToken
    test: current.res.status == 200
  noTenantPayments:
    beta:
      /api/payments:
        get:
          useCookie: false
          headers: {Cookie: 'JSESSIONID={{ betaCookie }}', X-Tenant-Id: '11111111-1111-1111-1111-111111111111'}
          body: null
    test: current.res.status == 200 && len(current.res.body.items) == 0
  noTenantRows:
    beta:
      /api/imports/{{ good }}/payment-rows:
        get:
          useCookie: false
          headers: {Cookie: 'JSESSIONID={{ betaCookie }}', X-Tenant-Id: '11111111-1111-1111-1111-111111111111'}
          body: null
    test: current.res.status == 404 && current.res.body.code == 'NOT_FOUND'
  noTenantConfirm:
    beta:
      /api/imports/{{ good }}/confirm:
        post:
          useCookie: false
          headers: {Cookie: 'JSESSIONID={{ betaCookie }}', X-CSRF-TOKEN: '{{ betaToken }}'}
          body:
            application/json: {version: 0}
    test: current.res.status == 404 && current.res.body.code == 'NOT_FOUND'
  reupload:
    api:
      /api/imports/payments/preview:
        post:
          headers: {Cookie: 'JSESSIONID={{ cookie }}', X-CSRF-TOKEN: '{{ token }}'}
          body:
            multipart/form-data: {file: ../../work/runn-payment-valid.csv}
    bind: {duplicate: current.res.body.id}
    test: current.res.status == 201 && current.res.body.status == 'PREVIEW_INVALID' && current.res.body.originalBatchId == good
  rejectDuplicate:
    api:
      /api/imports/{{ duplicate }}/confirm:
        post:
          headers: {Cookie: 'JSESSIONID={{ cookie }}', X-CSRF-TOKEN: '{{ token }}'}
          body:
            application/json: {version: 0}
    test: current.res.status == 409 && current.res.body.code == 'IMPORT_ALREADY_CONFIRMED' && current.res.body.errors[0].message == good
