spring:
  application:
    name: debt-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/debt}
    username: ${DB_USERNAME:debt}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: true
        path: /
  error:
    include-message: never
    include-stacktrace: never
