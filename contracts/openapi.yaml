openapi: 3.0.3
info:
  title: Debt Management API
  version: 0.3.0
  description: 'ローカル用の DB User と cookie session による債権管理 API。

    Tenant と role は認証済み User の DB 所属から毎回確認し、入力で選択しない。

    GET /api/csrf で匿名 session と CSRF token を取得し、POST /api/auth/login へ email/password と

    cookie/header を送る。成功時に session ID と CSRF token を更新するため GET /api/session を再取得する。

    Basic 認証は利用できない。明示 local profile の架空 User は環境変数で初期化し、既定 profile は API を拒否する。

    商用環境・メンバー招待・password recovery はこの最初の認証 slice に含めない。'
servers:
- url: /
  description: Same-origin API
security:
- sessionAuth: []
tags:
- name: Session
  description: Authentication context and CSRF session lifecycle
- name: Customers
  description: Tenant-scoped customer registration and optimistic updates
- name: Authentication
  description: Anonymous CSRF and email/password session login
- name: Invitations
  description: Administrator-issued one-use manual invitation links
- name: Invoices
  description: Tenant-scoped invoice facts and bounded receivables views
- name: Payments
  description: Immutable incoming JPY payment facts and bounded tenant-scoped pages
- name: PayerAliases
  description: Manual tenant-scoped payer-name to customer correspondences without allocation
- name: Imports
  description: Immutable tenant-scoped CSV previews and explicit all-or-nothing confirmation
- name: PaymentImports
  description: Payment CSV preview contract; implementation is delivered by the dependent runtime slice
paths:
  /api/invoices/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      tags: [Invoices]
      operationId: getInvoice
      summary: Read an invoice including its cancelled state
      responses:
        '200':
          description: Current invoice facts and derived outstanding amount
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/InvoiceNotFound'}
    put:
      tags: [Invoices]
      operationId: correctInvoice
      summary: Correct an active unallocated invoice with a reason and expected version
      description: Invoice number is immutable, including after cancellation. Locks the invoice and appends revision and audit atomically; a stale version or active allocation prevents changes. The real ledger adapter rejects any active cash or explicit fee, including one yen. Whole-operation reversals must remove every active allocation before correction or cancellation. Public allocation/reversal commands are not introduced here.
      security:
      - sessionAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvoiceCorrectionRequest'}
      responses:
        '200':
          description: Corrected invoice and incremented version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/InvoiceNotFound'}
        '409':
          description: VERSION_CONFLICT, INVOICE_NOT_ACTIVE or INVOICE_ALLOCATED; reload or reverse the active settlement first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /api/invoices/{id}/cancel:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    post:
      tags: [Invoices]
      operationId: cancelInvoice
      summary: Cancel an active unallocated invoice while retaining its facts and number
      description: Requires a reason and current version. Appends a cancellation revision and audit atomically. The original number remains permanently reserved and cancelled invoices are excluded from receivables. A repeat cancellation is rejected.
      security:
      - sessionAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvoiceCancelRequest'}
      responses:
        '200':
          description: Cancelled invoice with zero outstanding amount and retained original amount
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/InvoiceNotFound'}
        '409':
          description: VERSION_CONFLICT, INVOICE_NOT_ACTIVE or INVOICE_ALLOCATED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /api/invoices/{id}/history:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      tags: [Invoices]
      operationId: listInvoiceHistory
      summary: Read immutable invoice revisions in increasing revision order
      parameters:
      - name: cursor
        in: query
        schema: {type: integer, format: int64, minimum: -1, default: -1}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: At most limit revisions; null nextCursor indicates the end
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceHistoryPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/InvoiceNotFound'}
  /api/receivables:
    get:
      tags: [Invoices]
      operationId: listReceivables
      summary: Browse invoices by status in stable due-date and ID order
      description: Bounded tenant-scoped keyset page. ACTIVE is the compatible default; CANCELLED shows cancelled originals and ALL includes both states. Keep the selected status/customer/due filters when following nextCursor. Active outstandingAmount subtracts current cash allocations and explicit fees from the original amount using the same SQL snapshot as version; reversed operations are excluded. Cancelled outstandingAmount is zero while amount retains the original invoice value. Balances are never editable inputs.
      parameters:
      - name: customerId
        in: query
        schema: {type: string, format: uuid}
      - name: dueFrom
        in: query
        schema: {type: string, format: date}
      - name: dueTo
        in: query
        schema: {type: string, format: date}
      - name: cursor
        in: query
        schema: {type: string, maxLength: 47}
        description: Exact nextCursor from the preceding page; omit for the first page.
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      - name: status
        in: query
        description: Invoice state to browse; omitting this parameter preserves the active-only list.
        schema: {type: string, enum: [ACTIVE, CANCELLED, ALL], default: ACTIVE}
      responses:
        '200':
          description: Matching invoices with their status, original amount and outstanding amount
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReceivablesPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/payer-aliases:
    get:
      tags: [PayerAliases]
      operationId: listPayerAliases
      summary: List active manual payer correspondences in stable ID order
      description: ADMIN and ACCOUNTANT may read all active pairs in their authenticated tenant. Identical names may correspond to multiple customers; this endpoint does not choose a candidate or change any balance.
      parameters:
      - name: cursor
        in: query
        schema: {type: string, format: uuid}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Active correspondences only; nextCursor is null at the end
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PayerAliasesPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [PayerAliases]
      operationId: createPayerAlias
      summary: Register a manual payer-name to customer correspondence
      description: ADMIN and ACCOUNTANT may register a pair for an existing customer in the authenticated tenant. Uses the payment CSV text rule, stripping surrounding whitespace only; case, width, kana and Unicode normalization are never applied. The stripped name is 1 through 200 code points; controls, line separators and malformed Unicode are rejected before stripping. An active identical pair returns 409 PAYER_ALIAS_EXISTS. A deactivated pair may be registered again with a new ID, retaining the original row and audit.
      security:
      - sessionAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PayerAliasCreateRequest'}
      responses:
        '201':
          description: Correspondence and registration audit saved atomically
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PayerAliasResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Customer does not exist in the authenticated tenant, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: Active payer/customer pair already exists, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /api/payer-aliases/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      tags: [PayerAliases]
      operationId: getPayerAlias
      summary: Read the original correspondence including its deactivation history
      description: Retains the original name, customer and registering actor/time after deactivation. Other tenants return 404.
      responses:
        '200':
          description: Active or deactivated correspondence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PayerAliasResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Correspondence not found in this tenant, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /api/payer-aliases/{id}/deactivation:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    post:
      tags: [PayerAliases]
      operationId: deactivatePayerAlias
      summary: Deactivate an incorrect correspondence with its current version and reason
      description: ADMIN and ACCOUNTANT may deactivate once, atomically saving actor/time/reason and audit while retaining the original correspondence. A stale version or repeat returns 409 VERSION_CONFLICT. No physical deletion, reactivation or allocation is performed.
      security:
      - sessionAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PayerAliasDeactivateRequest'}
      responses:
        '200':
          description: Deactivated correspondence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PayerAliasResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Correspondence not found in this tenant, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: Stale version or already deactivated, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /api/payments:
    get:
      tags: [Payments]
      operationId: listPayments
      summary: List immutable incoming payments in stable transfer-date and ID order
      description: Bounded keyset page of confirmed receipts. unallocatedAmount subtracts current cash allocations from the original amount; explicit fees do not consume payment cash and reversed operations are excluded. Original facts and balances share one SQL snapshot. Balances are never editable inputs. Date filters are inclusive; invalid dates, reversed bounds and malformed cursors return 400.
      parameters:
      - name: dateFrom
        in: query
        schema: {type: string, format: date}
      - name: dateTo
        in: query
        schema: {type: string, format: date}
      - name: cursor
        in: query
        schema: {type: string, maxLength: 47}
        description: Exact nextCursor from the preceding page; omit for the first page.
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Incoming payment facts and their unallocated amounts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentsPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/imports/customers/template:
    get:
      tags: [Imports]
      operationId: downloadCustomerImportTemplate
      summary: Download the UTF-8 BOM customer CSV header
      description: Header only. Columns are customer_code,customer_name. Surrounding field whitespace is stripped as in manual customer registration; case and Unicode are not normalized.
      responses:
        '200':
          description: Fixed-format CSV template
          headers:
            Content-Disposition:
              schema: {type: string}
              description: Attachment filename customers-template.csv
          content:
            text/csv:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/imports/customers/preview:
    post:
      tags: [Imports]
      operationId: previewCustomerImport
      summary: Store a customer CSV preview without creating any customer
      description: New customers only. Existing or repeated customer codes invalidate the entire batch. Syntax and row errors are saved for correction; a preview expires after 24 hours. Maximum 10MiB and 10000 data records.
      security:
      - sessionAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: Immutable valid or invalid preview; business rows remain unchanged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportBatchResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413':
          description: Multipart upload exceeds its bounded size
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /api/imports/invoices/template:
    get:
      tags: [Imports]
      operationId: downloadInvoiceImportTemplate
      summary: Download the UTF-8 BOM invoice CSV header
      description: Header only. Columns are customer_code,invoice_number,issue_date,due_date,amount. Numbers strip surrounding whitespace without case or Unicode normalization. Dates are strict YYYY-MM-DD with year 0001 through 9999; amount is a positive integer no greater than 9007199254740991 yen.
      responses:
        '200':
          description: Fixed-format CSV template
          headers:
            Content-Disposition:
              schema: {type: string}
              description: Attachment filename invoices-template.csv
          content:
            text/csv:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/imports/invoices/preview:
    post:
      tags: [Imports]
      operationId: previewInvoiceImport
      summary: Store an invoice CSV preview without creating any invoice
      description: Customers must already exist in the authenticated tenant. Duplicate invoice numbers invalidate the whole batch, including numbers reserved by cancelled invoices. Due date must be on or after issue date. Stores immutable facts and customer versions for 24 hours. Confirmation revalidates the stored customer references and creates every invoice, initial revision and audit atomically. Maximum 10MiB and 10000 data records.
      security:
      - sessionAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: Immutable valid or invalid preview; business rows remain unchanged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportBatchResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413':
          description: Multipart upload exceeds its bounded size
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /api/imports/payments/template:
    get:
      tags: [PaymentImports]
      operationId: downloadPaymentImportTemplate
      summary: Download the UTF-8 BOM payment CSV header
      description: Header only. Columns are transaction_id,transfer_date,payer_name,amount. Transaction IDs and payer names strip surrounding whitespace only, without case, width or Unicode normalization. Transfer dates are strict YYYY-MM-DD with year 0001 through 9999; amount is a positive integer no greater than 9007199254740991 yen. Zero, outgoing payments and refunds are outside the initial scope.
      responses:
        '200':
          description: Fixed-format CSV template
          headers:
            Content-Disposition:
              schema: {type: string}
              description: Attachment filename payments-template.csv
          content:
            text/csv:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/imports/payments/preview:
    post:
      tags: [PaymentImports]
      operationId: previewPaymentImport
      summary: Store a payment CSV preview without creating any payment
      description: Fictional bank receipts, with tenant-unique transaction IDs permanently reserved by confirmed payments, including after allocation reversal. Repeated IDs within the file or existing payments invalidate the entire batch. Stores an immutable snapshot for 24 hours without changing payment facts or audits. Preview does not reserve transaction IDs or semantic content. Explicit confirmation atomically registers all receipts and audits after revalidating IDs, version, expiry and duplicates. Maximum 10MiB and 10000 data records.
      security:
      - sessionAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: Immutable valid or invalid preview; business rows remain unchanged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportBatchResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413':
          description: Multipart upload exceeds its bounded size
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /api/imports/{id}:
    parameters:
    - {$ref: '#/components/parameters/ImportId'}
    get:
      tags: [Imports]
      operationId: getImportBatch
      summary: Read the stored preview or confirmed result
      description: A different tenant or unsupported import kind returns 404. Reads remain available after preview expiry for correction and outcome recovery.
      responses:
        '200':
          description: Current server-side batch state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportBatchResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ImportNotFound'}
  /api/imports/{id}/rows:
    parameters:
    - {$ref: '#/components/parameters/ImportId'}
    - {$ref: '#/components/parameters/ImportCursor'}
    - {$ref: '#/components/parameters/ImportLimit'}
    get:
      tags: [Imports]
      operationId: listImportRows
      summary: Read an immutable customer or invoice preview page in original record order
      description: Payment batches use payment-rows and return 409 IMPORT_KIND_UNSUPPORTED here. Other tenants return 404 before kind dispatch.
      responses:
        '200':
          description: At most limit rows; nextCursor is zero at the end
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportRowsPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ImportNotFound'}
        '409':
          description: IMPORT_KIND_UNSUPPORTED; use payment-rows for payment batches.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /api/imports/{id}/payment-rows:
    parameters:
    - {$ref: '#/components/parameters/ImportId'}
    - {$ref: '#/components/parameters/ImportCursor'}
    - {$ref: '#/components/parameters/ImportLimit'}
    get:
      tags: [PaymentImports]
      operationId: listPaymentImportRows
      summary: Read immutable payment preview rows in original record order
      description: Payment batches only. Other kinds and other tenants return 404. Original input is retained for invalid fields; valid amounts are canonical integer strings.
      responses:
        '200':
          description: At most limit rows; nextCursor is zero at the end
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentImportRowsPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ImportNotFound'}
  /api/imports/{id}/confirm:
    parameters:
    - {$ref: '#/components/parameters/ImportId'}
    post:
      tags: [Imports]
      operationId: confirmImport
      summary: Confirm the immutable customer, invoice or payment snapshot atomically
      description: Accepts only the preview version, never replacement rows. Customer, invoice or immutable payment facts, initial invoice revisions, audits and batch confirmation share one transaction. Payment transaction IDs remain reserved after allocation reversal. Invoice customer versions are revalidated under row locks. Re-sending the original preview version after success returns the same result, even after expiry. A conflicting preview is invalidated only after the business transaction rolls back; re-preview the corrected CSV.
      security:
      - sessionAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportConfirmRequest'
      responses:
        '200':
          description: Confirmed batch result, including idempotent retries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportBatchResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ImportNotFound'}
        '409':
          description: IMPORT_INVALID, IMPORT_EXPIRED, VERSION_CONFLICT, IMPORT_REFERENCE_CONFLICT, IMPORT_ALREADY_CONFIRMED or IMPORT_KIND_UNSUPPORTED. For confirmed content in a different batch, errors contains field batchId and message with the original UUID.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /api/imports/{id}/errors:
    parameters:
    - {$ref: '#/components/parameters/ImportId'}
    - {$ref: '#/components/parameters/ImportCursor'}
    - {$ref: '#/components/parameters/ImportLimit'}
    get:
      tags: [Imports]
      operationId: listImportErrors
      summary: Read all correction details through bounded pages
      responses:
        '200':
          description: At most limit errors; nextCursor is zero at the end
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportErrorsPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ImportNotFound'}
  /api/imports/{id}/errors.csv:
    parameters:
    - {$ref: '#/components/parameters/ImportId'}
    get:
      tags: [Imports]
      operationId: downloadImportErrors
      summary: Download the complete spreadsheet-safe error snapshot
      description: UTF-8 BOM CSV with row_number,field,input_value,input_truncated,reason,correction. This report is for correction guidance, not a re-import file. Formula-like values are neutralized.
      responses:
        '200':
          description: All stored errors, matching the paginated error API
          headers:
            Content-Disposition:
              schema: {type: string}
              description: Attachment filename import-errors.csv
          content:
            text/csv:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ImportNotFound'}
  /api/session:
    get:
      tags:
      - Session
      operationId: getSession
      summary: Read the authenticated user and issue a CSRF token
      description: 認証済み User の DB 所属、role、現在の CSRF token を返す。session に古い所属情報だけを保持しても、その値は権限根拠にしない。
      responses:
        '200':
          description: Authenticated user and CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/logout:
    post:
      tags:
      - Session
      operationId: logout
      summary: Invalidate the CSRF session
      description: CSRF 検証後に session と SecurityContext を失効する。旧 cookie と token は再利用できない。
      security:
      - sessionAuth: []
        csrfToken: []
      responses:
        '204':
          description: Session invalidated; no response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/customers:
    get:
      tags:
      - Customers
      operationId: listCustomers
      summary: List customers in the authenticated tenant
      description: 顧客コードの昇順。Tenant header/body によるスコープ変更はできない。
      responses:
        '200':
          description: Tenant-scoped customer list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Customers
      operationId: createCustomer
      summary: Register a customer and its audit event atomically
      security:
      - sessionAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreateRequest'
      responses:
        '201':
          description: Customer registered
          headers:
            Location:
              description: Relative URI of the created customer
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Customer code is already registered in this tenant (DUPLICATE_CUSTOMER_CODE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/customers/{id}:
    put:
      tags:
      - Customers
      operationId: updateCustomer
      summary: Update a customer with its expected version
      description: 'id は同じ Tenant に属する必要がある。他 Tenant の id も存在しない id と同じ 404。

        更新・version 加算・操作履歴を同じ transaction で確定する。

        '
      security:
      - sessionAuth: []
        csrfToken: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
      responses:
        '200':
          description: Updated customer with incremented version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Customer does not exist in the authenticated tenant (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stale version (VERSION_CONFLICT) or duplicate code (DUPLICATE_CUSTOMER_CODE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/csrf:
    get:
      tags:
      - Authentication
      operationId: getCsrf
      summary: Issue an anonymous CSRF session token
      security: []
      responses:
        '200':
          description: CSRF token and HttpOnly session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/login:
    post:
      tags:
      - Authentication
      operationId: login
      summary: Authenticate persisted user and rotate the session
      description: 成功時は204。以前の session ID と CSRF token を再利用せず、GET /api/session から新しい token を取得する。失敗は未登録emailと誤passwordで区別しない。
      security:
      - csrfToken: []
        csrfSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '204':
          description: Authenticated; session cookie rotated; no response body
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Validated login attempts temporarily limited (RATE_LIMITED); retry after1..60seconds. Cookie
            replacement does not reset the budget.
          headers:
            Retry-After:
              description: Whole seconds until retry; bounded between1and60
              schema:
                type: integer
                minimum: 1
                maximum: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/invitations:
    post:
      tags:
      - Invitations
      operationId: issueInvitation
      summary: Issue a one-use manual link for a member in the current tenant
      description: ADMIN only. Tenant is fixed from the current DB membership. The fragment URL is returned once;
        no email is sent. It expires after24hours. Existing global email conflicts return a generic409 without identifying
        another tenant. This incremental API exposes issuance only; anonymous inspection and acceptance are added
        by the next PR.
      security:
      - sessionAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationIssueRequest'
      responses:
        '201':
          description: One-time secret fragment URL; Cache-Control:no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationIssuedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Invitation cannot be issued (INVITATION_UNAVAILABLE); no tenant membership details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/invitations/inspect:
    post:
      tags:
      - Invitations
      operationId: inspectInvitation
      summary: Inspect minimal invitation information using a bearer token
      description: Anonymous accessible with CSRF session cookie/header. Token is sent only in the POST body; no
        token in request URL or audit. Invalid/expired/used tokens share a generic error.
      security:
      - csrfSession: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationInspectRequest'
      responses:
        '200':
          description: Invitation information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationInspectionResponse'
        '400':
          description: Malformed input (VALIDATION_ERROR/INVALID_REQUEST) or invalid, expired, consumed, mismatched
            invitation (INVITATION_INVALID); token-state errors have the same public response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/invitations/accept:
    post:
      tags:
      - Invitations
      operationId: acceptInvitation
      summary: Accept an invitation and create a user atomically
      description: Anonymous accessible with CSRF session cookie/header. Token is sent only in the POST body; no
        token in request URL or audit. Invalid/expired/used tokens share a generic error.
      security:
      - csrfSession: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
      responses:
        '201':
          description: User created; invitation consumed; not automatically logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptedResponse'
        '400':
          description: Malformed input (VALIDATION_ERROR/INVALID_REQUEST) or invalid, expired, consumed, mismatched
            invitation (INVITATION_INVALID); token-state errors have the same public response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Cannot accept invitation (INVITATION_UNAVAILABLE); includes global email conflict without
            identifying another tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  parameters:
    ImportId:
      name: id
      in: path
      required: true
      description: Server-issued batch ID
      schema: {type: string, format: uuid}
    ImportCursor:
      name: cursor
      in: query
      description: Last record or error number from the preceding page; zero starts the snapshot
      schema: {type: integer, minimum: 0, maximum: 2147483646, default: 0}
    ImportLimit:
      name: limit
      in: query
      description: Maximum items per page
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
  securitySchemes:
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Token obtained from GET /api/session; required for mutations
    csrfSession:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Anonymous CSRF session cookie, replaced by authenticated session cookie at login
    sessionAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Authenticated server-side servlet session; HttpOnly, SameSite=Lax, Path=/; local HTTP only permits
        Secure=false
  responses:
    InvoiceNotFound:
      description: Invoice not found in the authenticated tenant, including deliberately hidden cross-tenant IDs
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    ImportNotFound:
      description: Batch not found in the authenticated tenant
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    BadRequest:
      description: Invalid fields or malformed JSON (VALIDATION_ERROR or INVALID_REQUEST)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing/expired session or invalid login credentials (UNAUTHENTICATED); login never distinguishes
        unknown email from wrong password
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: CSRF token/session mismatch (CSRF_INVALID) or authenticated permission/API access denial (ACCESS_DENIED).
        These codes distinguish stale session handling from role restrictions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    InvoiceCancelRequest:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 1000}
    InvoiceCorrectionRequest:
      type: object
      additionalProperties: false
      required: [version, customerId, issueDate, dueDate, amount, reason]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        customerId: {type: string, format: uuid}
        issueDate: {type: string, format: date}
        dueDate: {type: string, format: date}
        amount: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        reason: {type: string, minLength: 1, maxLength: 1000}
    InvoiceResponse:
      type: object
      required: [id, customerId, customerCode, customerName, invoiceNumber, issueDate, dueDate, amount, outstandingAmount, version, status, createdAt, updatedAt, cancelledAt]
      properties:
        id: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        customerCode: {type: string, minLength: 1, maxLength: 50}
        customerName: {type: string, minLength: 1, maxLength: 200}
        invoiceNumber: {type: string, minLength: 1, maxLength: 100}
        issueDate: {type: string, format: date}
        dueDate: {type: string, format: date}
        amount: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        outstandingAmount: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
        version: {type: integer, format: int64, minimum: 0}
        status: {type: string, enum: [ACTIVE, CANCELLED]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        cancelledAt: {type: string, format: date-time, nullable: true}
    InvoiceHistorySnapshot:
      type: object
      required: [customerId, customerCode, customerName, invoiceNumber, issueDate, dueDate, amount, status, sourceBatchId, version]
      properties:
        customerId: {type: string, format: uuid}
        customerCode: {type: string, minLength: 1, maxLength: 50}
        customerName: {type: string, minLength: 1, maxLength: 200}
        invoiceNumber: {type: string, minLength: 1, maxLength: 100}
        issueDate: {type: string, format: date}
        dueDate: {type: string, format: date}
        amount: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        status: {type: string, enum: [ACTIVE, CANCELLED]}
        sourceBatchId: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 0}
    InvoiceHistoryEntry:
      type: object
      required: [revision, operation, reason, actorUserId, occurredAt, snapshot, actorEmail]
      properties:
        revision: {type: integer, format: int64, minimum: 0}
        operation: {type: string, enum: [CREATED, CORRECTED, CANCELLED]}
        reason: {type: string, nullable: true, maxLength: 1000}
        actorUserId: {type: string, format: uuid}
        occurredAt: {type: string, format: date-time}
        snapshot: {$ref: '#/components/schemas/InvoiceHistorySnapshot'}
        actorEmail:
          type: string
          format: email
          maxLength: 254
          description: Current email label of the actor in the same tenant, including disabled users. actorUserId remains authoritative; this display label is not a historical snapshot and may change without rewriting the revision or audit.
    InvoiceHistoryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/InvoiceHistoryEntry'}
        nextCursor: {type: integer, format: int64, minimum: 0, nullable: true}
    ReceivableResponse:
      type: object
      required: [id, customerId, customerCode, customerName, invoiceNumber, issueDate, dueDate, amount, outstandingAmount, version, status]
      properties:
        id: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        customerCode: {type: string, minLength: 1, maxLength: 50}
        customerName: {type: string, minLength: 1, maxLength: 200}
        invoiceNumber: {type: string, minLength: 1, maxLength: 100}
        issueDate: {type: string, format: date}
        dueDate: {type: string, format: date}
        amount: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        outstandingAmount: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
        version: {type: integer, format: int64, minimum: 0}
        status: {type: string, enum: [ACTIVE, CANCELLED]}
    ReceivablesPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ReceivableResponse'}
        nextCursor: {type: string, maxLength: 47, nullable: true}
    PayerAliasCreateRequest:
      type: object
      additionalProperties: false
      required: [payerName, customerId]
      properties:
        payerName: {type: string, minLength: 1, description: 'Surrounding whitespace only is removed; 1 through 200 code points after stripping, using the payment CSV text rule.'}
        customerId: {type: string, format: uuid}
    PayerAliasDeactivateRequest:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        reason: {type: string, minLength: 1, description: 'Required explanation, 1 through 500 code points after stripping; controls and line separators are rejected before stripping.'}
    PayerAliasResponse:
      type: object
      required: [id, payerName, customerId, active, version, createdByUserId, createdAt, deactivatedByUserId, deactivatedAt, deactivationReason]
      properties:
        id: {type: string, format: uuid}
        payerName: {type: string, minLength: 1, maxLength: 200}
        customerId: {type: string, format: uuid}
        active: {type: boolean}
        version: {type: integer, format: int64, minimum: 0}
        createdByUserId: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        deactivatedByUserId: {type: string, format: uuid, nullable: true}
        deactivatedAt: {type: string, format: date-time, nullable: true}
        deactivationReason: {type: string, maxLength: 500, nullable: true}
    PayerAliasesPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/PayerAliasResponse'}
        nextCursor: {type: string, format: uuid, nullable: true}
    PaymentResponse:
      type: object
      required: [id, transactionId, transferDate, payerName, amount, unallocatedAmount, sourceBatchId, createdByUserId, createdAt]
      properties:
        id: {type: string, format: uuid}
        transactionId: {type: string, minLength: 1, maxLength: 100}
        transferDate: {type: string, format: date}
        payerName: {type: string, minLength: 1, maxLength: 200}
        amount: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        unallocatedAmount:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Original payment amount minus active cash allocations. Explicit fees do not consume cash; whole-operation reversals exclude their original allocations.
        sourceBatchId: {type: string, format: uuid}
        createdByUserId: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    PaymentsPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/PaymentResponse'}
        nextCursor: {type: string, maxLength: 47, nullable: true}
    ImportConfirmRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer, format: int64, minimum: 0}
    ImportBatchResponse:
      type: object
      required: [id, kind, status, version, rowCount, errorCount, createdAt, expiresAt, confirmedAt, confirmedCount]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [CUSTOMER, INVOICE, PAYMENT]}
        status: {type: string, enum: [PREVIEW_VALID, PREVIEW_INVALID, CONFIRMED]}
        version: {type: integer, format: int64, minimum: 0}
        rowCount: {type: integer, minimum: 0, maximum: 10000}
        errorCount: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        confirmedAt: {type: string, format: date-time, nullable: true}
        confirmedCount: {type: integer, minimum: 0, maximum: 10000}
        originalBatchId:
          type: string
          format: uuid
          nullable: true
          description: An already-confirmed batch in this tenant with the same semantic content; absent or null when none exists. The current confirmed batch does not refer to itself.
    ImportRowResponse:
      type: object
      required: [recordNumber, rowNumber, customerCode, customerName, valid]
      properties:
        recordNumber: {type: integer, minimum: 1, maximum: 10000}
        rowNumber: {type: integer, minimum: 2}
        customerCode: {type: string, maxLength: 2048}
        customerName: {type: string, maxLength: 2048}
        invoiceNumber: {type: string, maxLength: 2048, nullable: true}
        issueDate: {type: string, maxLength: 2048, nullable: true}
        dueDate: {type: string, maxLength: 2048, nullable: true}
        amount:
          type: string
          maxLength: 2048
          nullable: true
          description: Invoice preview value, canonical integer text when valid; original input when invalid. Not a mutable balance.
        valid: {type: boolean}
    PaymentImportRowResponse:
      type: object
      required: [recordNumber, rowNumber, transactionId, transferDate, payerName, amount, valid]
      properties:
        recordNumber: {type: integer, minimum: 1, maximum: 10000}
        rowNumber: {type: integer, minimum: 2}
        transactionId: {type: string, maxLength: 2048}
        transferDate: {type: string, maxLength: 2048}
        payerName: {type: string, maxLength: 2048}
        amount:
          type: string
          maxLength: 2048
          description: Canonical positive integer JPY when valid; original input when invalid. Not a mutable balance.
        valid: {type: boolean}
    PaymentImportRowsPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/PaymentImportRowResponse'}
        nextCursor: {type: integer, minimum: 0}
    ImportErrorResponse:
      type: object
      required: [errorNumber, rowNumber, field, inputValue, inputTruncated, reasonCode, reason, correction]
      properties:
        errorNumber: {type: integer, minimum: 1}
        rowNumber: {type: integer, minimum: 1}
        field: {type: string, minLength: 1, maxLength: 100}
        inputValue: {type: string, maxLength: 200}
        inputTruncated: {type: boolean}
        reasonCode: {type: string, minLength: 1}
        reason: {type: string, minLength: 1}
        correction: {type: string, minLength: 1}
    ImportRowsPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ImportRowResponse'}
        nextCursor: {type: integer, minimum: 0}
    ImportErrorsPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ImportErrorResponse'}
        nextCursor: {type: integer, minimum: 0}
    SessionResponse:
      type: object
      required:
      - userId
      - email
      - role
      - tenantId
      - csrfToken
      - csrfHeaderName
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        role:
          type: string
          enum:
          - ADMIN
          - ACCOUNTANT
        tenantId:
          type: string
          format: uuid
        csrfToken:
          type: string
          minLength: 1
        csrfHeaderName:
          type: string
          minLength: 1
          example: X-CSRF-TOKEN
    CustomerResponse:
      type: object
      required:
      - id
      - code
      - name
      - version
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 200
        version:
          type: integer
          format: int64
          minimum: 0
    CustomerCreateRequest:
      type: object
      required:
      - code
      - name
      description: Surrounding whitespace is stripped; blank/control characters are rejected
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
    CustomerUpdateRequest:
      type: object
      required:
      - code
      - name
      - version
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 200
        version:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: false
    ApiError:
      type: object
      required:
      - code
      - message
      - errors
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
        message:
          type: string
    CsrfResponse:
      type: object
      required:
      - csrfToken
      - csrfHeaderName
      properties:
        csrfToken:
          type: string
          minLength: 1
        csrfHeaderName:
          type: string
          minLength: 1
          example: X-CSRF-TOKEN
    AuthLoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: ASCII email; surrounding whitespace stripped and lowercased for lookup
          pattern: ^[\x20-\x7E]+$
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: No trim/normalization; maximum512UTF-8bytes. Creation policy is separate from login verification.
    InvitationIssueRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - role
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: ASCII email; surrounding whitespace stripped and lowercased by the domain
