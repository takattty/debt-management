name: Bootstrap trusted review policy
# One-time trust seed: requires an out-of-band, user-approved exact SHA pin.
on:
  pull_request_review:
    types: [submitted]
permissions:
  contents: read
  pull-requests: read
  statuses: write
concurrency:
  group: independent-review-writer
  cancel-in-progress: false
jobs:
  bootstrap:
    if: >-
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.base.sha == '87b2c64de0c7b9c2439a0882d31e7eb4a910b1b6' &&
      github.event.pull_request.head.sha == vars.BOOTSTRAP_REVIEW_SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ vars.BOOTSTRAP_REVIEW_SHA }}
          persist-credentials: false
      - run: node --test .github/scripts/review-gate.test.cjs
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          APPROVED_SHA: ${{ vars.BOOTSTRAP_REVIEW_SHA }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number });
            if (pr.base.sha !== '87b2c64de0c7b9c2439a0882d31e7eb4a910b1b6' || pr.head.sha !== process.env.APPROVED_SHA) {
              core.setFailed('Bootstrap pin or initial base no longer matches.'); return;
            }
            const { evaluate } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/review-gate.cjs`);
            const reviews = await github.paginate(github.rest.pulls.listReviews, { ...context.repo, pull_number: pr.number });
            const passed = evaluate(reviews, pr.head.sha);
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: pr.head.sha, context: 'independent-review',
              state: passed ? 'success' : 'failure',
              description: passed ? 'User-pinned bootstrap SHA independently reviewed.' : 'Bootstrap SHA lacks passing independent review.' });
            if (!passed) core.setFailed('Explicit independent review is required.');
