name: Independent review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
  workflow_run:
    workflows: [Review event relay]
    types: [completed]
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: read
  statuses: write
concurrency:
  group: independent-review-writer
  cancel-in-progress: false
jobs:
  attest-review:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: policy
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
      - name: Install trusted pinned Markdown parser
        run: npm --prefix .github/scripts ci --ignore-scripts --cache work/npm-cache
      - run: node --test .github/scripts/*.test.cjs
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          TRUSTED_POLICY_SHA: ${{ steps.policy.outputs.sha }}
        with:
          script: |
            const { sweep } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/review-sweep.cjs`);
            await sweep(github, context.repo, context.payload.repository.default_branch, process.env.TRUSTED_POLICY_SHA);
