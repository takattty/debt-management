desc: Invoice CSV preview, field corrections and tenant isolation over real HTTP
concurrency: debt-api-acceptance
labels: [api, importing, invoices, security]
runners:
  api:
    endpoint: ${RUNN_BASE_URL:-http://127.0.0.1:8080}
    openapi3: ../../contracts/openapi.yaml
    useCookie: true
  beta:
    endpoint: ${RUNN_BASE_URL:-http://127.0.0.1:8080}
    openapi3: ../../contracts/openapi.yaml
    useCookie: true
  invalid:
    endpoint: ${RUNN_BASE_URL:-http://127.0.0.1:8080}
    openapi3: ../../contracts/openapi.yaml
    skipValidateRequest: true
vars:
  password: ${LOCAL_SEED_PASSWORD}
  fixture: json://../../work/runn-invoice-metadata.json
secrets: [vars.password, anonymousToken, anonymousCookie, cookie, token, betaToken, betaAnonymousCookie]
steps:
  unauthenticatedTemplate:
    invalid:
      /api/imports/invoices/template:
        get:
          body: null
    test: current.res.status == 401
  csrf:
    api:
      /api/csrf:
        get:
          body: null
    bind:
      anonymousToken: current.res.body.csrfToken
      anonymousCookie: current.res.cookies.JSESSIONID.Value
    test: current.res.status == 200
  login:
    api:
      /api/auth/login:
        post:
          headers:
            Cookie: JSESSIONID={{ anonymousCookie }}
            X-CSRF-TOKEN: '{{ anonymousToken }}'
          body:
            application/json:
              email: alpha-accountant@example.test
              password: '{{ vars.password }}'
    bind:
      cookie: current.res.cookies.JSESSIONID.Value
    test: current.res.status == 204
  session:
    api:
      /api/session:
        get:
          body: null
    bind:
      token: current.res.body.csrfToken
    test: current.res.status == 200
  customer:
    api:
      /api/customers:
        post:
          headers:
            X-CSRF-TOKEN: '{{ token }}'
          body:
            application/json:
              code: '{{ vars.fixture.customerCode }}'
              name: 架空請求CSVの取引先
    bind:
      customerId: current.res.body.id
    test: current.res.status == 201
  template:
    api:
      /api/imports/invoices/template:
        get:
          body: null
    test: current.res.status == 200 && current.res.rawBody == '\uFEFFcustomer_code,invoice_number,issue_date,due_date,amount\r\n'
      && current.res.headers['Content-Disposition'][0] == 'attachment; filename="invoices-template.csv"'
  missingCsrf:
    invalid:
      /api/imports/invoices/preview:
        post:
          headers:
            Cookie: JSESSIONID={{ cookie }}
          body:
            multipart/form-data:
              file: ../../work/runn-invoice-valid.csv
    test: current.res.status == 403 && current.res.body.code == 'CSRF_INVALID'
  previewInvalid:
    api:
      /api/imports/invoices/preview:
        post:
          headers:
            X-CSRF-TOKEN: '{{ token }}'
          body:
            multipart/form-data:
              file: ../../work/runn-invoice-invalid.csv
    bind:
      invalidBatch: current.res.body.id
    test: current.res.status == 201 && current.res.body.kind == 'INVOICE'
      && current.res.body.status == 'PREVIEW_INVALID' && current.res.body.errorCount == 2
  errors:
    api:
      /api/imports/{{ invalidBatch }}/errors:
        get:
          body: null
    test: current.res.status == 200 && len(current.res.body.items) == 2
      && current.res.body.items[0].rowNumber == 3 && current.res.body.items[0].field == 'amount'
      && current.res.body.items[0].inputValue == 'abc' && current.res.body.items[0].correction != ''
      && current.res.body.items[1].reasonCode == 'CUSTOMER_NOT_FOUND'
  errorCsv:
    api:
      /api/imports/{{ invalidBatch }}/errors.csv:
        get:
          body: null
    test: current.res.status == 200 && current.res.rawBody contains '"3","amount","abc"'
      && current.res.rawBody contains '"3","customer_code","MISSING-CUSTOMER"'
  repaired:
    api:
      /api/imports/invoices/preview:
        post:
          headers:
            X-CSRF-TOKEN: '{{ token }}'
          body:
            multipart/form-data:
              file: ../../work/runn-invoice-valid.csv
    bind:
      validBatch: current.res.body.id
    test: current.res.status == 201 && current.res.body.status == 'PREVIEW_VALID' && current.res.body.rowCount == 2
  rows:
    api:
      /api/imports/{{ validBatch }}/rows?limit=1:
        get:
          body: null
    test: current.res.status == 200 && len(current.res.body.items) == 1 && current.res.body.nextCursor == 1
      && current.res.body.items[0].valid && current.res.body.items[0].amount == '100000'
      && current.res.body.items[0].issueDate == '2026-10-29' && current.res.body.items[0].dueDate == '2026-11-30'
  confirm:
    api:
      /api/imports/{{ validBatch }}/confirm:
        post:
          headers:
            X-CSRF-TOKEN: '{{ token }}'
          body:
            application/json:
              version: 0
    test: current.res.status == 200 && current.res.body.status == 'CONFIRMED' && current.res.body.confirmedCount == 2
  resend:
    api:
      /api/imports/{{ validBatch }}/confirm:
        post:
          headers:
            X-CSRF-TOKEN: '{{ token }}'
          body:
            application/json:
              version: 0
    test: current.res.status == 200 && compare(current.res.body, steps.confirm.res.body)
  receivables:
    api:
      /api/receivables?customerId={{ customerId }}&limit=1:
        get:
          body: null
    bind:
      firstReceivable: current.res.body.items[0].id
      next: current.res.body.nextCursor
    test: current.res.status == 200 && len(current.res.body.items) == 1 && next != null
      && current.res.body.items[0].amount == current.res.body.items[0].outstandingAmount
      && current.res.body.items[0].customerCode == vars.fixture.customerCode
  nextPage:
    api:
      /api/receivables?customerId={{ customerId }}&limit=1&cursor={{ next }}:
        get:
          body: null
    test: current.res.status == 200 && len(current.res.body.items) == 1 && current.res.body.nextCursor == null
      && current.res.body.items[0].id != firstReceivable
  invalidPage:
    invalid:
      /api/receivables?limit=101:
        get:
          headers:
            Cookie: JSESSIONID={{ cookie }}
          body: null
    test: current.res.status == 400
  reorderedReupload:
    api:
      /api/imports/invoices/preview:
        post:
          headers:
            X-CSRF-TOKEN: '{{ token }}'
          body:
            multipart/form-data:
              file: ../../work/runn-invoice-reordered.csv
    bind:
      duplicate: current.res.body.id
    test: current.res.status == 201 && current.res.body.status == 'PREVIEW_INVALID' && current.res.body.originalBatchId == validBatch
  rejectDuplicate:
    api:
      /api/imports/{{ duplicate }}/confirm:
        post:
          headers:
            X-CSRF-TOKEN: '{{ token }}'
          body:
            application/json:
              version: 0
    test: current.res.status == 409 && current.res.body.code == 'IMPORT_ALREADY_CONFIRMED'
      && current.res.body.errors[0].field == 'batchId' && current.res.body.errors[0].message == validBatch
  betaCsrf:
    beta:
      /api/csrf:
        get:
          body: null
    bind:
      betaToken: current.res.body.csrfToken
      betaAnonymousCookie: current.res.cookies.JSESSIONID.Value
    test: current.res.status == 200
  betaLogin:
    beta:
      /api/auth/login:
        post:
          headers:
            X-CSRF-TOKEN: '{{ betaToken }}'
            Cookie: JSESSIONID={{ betaAnonymousCookie }}
          body:
            application/json:
              email: beta-admin@example.test
              password: '{{ vars.password }}'
    test: current.res.status == 204
  noTenantLeak:
    beta:
      /api/receivables?customerId={{ customerId }}:
        get:
          headers:
            X-Tenant-Id: 11111111-1111-1111-1111-111111111111
          body: null
    test: current.res.status == 200 && len(current.res.body.items) == 0
